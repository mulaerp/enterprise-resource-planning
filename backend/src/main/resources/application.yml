spring:
  application:
    name: mula-erp-backend
  
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/mulaerp}
    username: ${DATABASE_USERNAME:mulaerp}
    password: ${DATABASE_PASSWORD:mulaerp123}
    driver-class-name: org.postgresql.Driver
  
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
  
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations: classpath:db/migration
  
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:mulaerp-redis-password}
  
  security:
    jwt:
      secret: ${JWT_SECRET:your-super-secret-jwt-key-change-in-production-min-32-chars}
      expiration: 86400000 # 24 hours

server:
  port: 8080
  servlet:
    context-path: /

logging:
  level:
    com.mulaerp: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
