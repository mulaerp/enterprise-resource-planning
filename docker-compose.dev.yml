version: '3.8'

services:
  # Simplified backend for development - just run the jar
  backend:
    image: eclipse-temurin:17-jdk
    working_dir: /app
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - DATABASE_URL=jdbc:postgresql://postgres:5432/mulaerp
      - DATABASE_USERNAME=mulaerp
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-mulaerp123}
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-mulaerp-redis-password}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production-min-32-chars}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - mulaerp-network
    volumes:
      - ./backend:/app
    command: >
      sh -c "
      if [ ! -f /app/target/*.jar ]; then
        echo 'Building backend with Maven...'
        apt-get update && apt-get install -y maven
        mvn clean package -DskipTests
      fi
      echo 'Starting backend...'
      java -jar /app/target/*.jar
      "
  
  # Simplified frontend for development
  frontend:
    image: node:20
    working_dir: /app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    networks:
      - mulaerp-network
    volumes:
      - ./frontend:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host"
