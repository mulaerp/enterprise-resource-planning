services:
  # Frontend - React Application
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=http://localhost:8080
    networks:
      - mulaerp-network
    restart: unless-stopped
    command: npm run dev -- --host


  # Backend - Java Spring Boot Application
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=production
      - DATABASE_URL=jdbc:postgresql://postgres:5432/mulaerp
      - DATABASE_USERNAME=mulaerp
      - DATABASE_PASSWORD=${DATABASE_PASSWORD:-mulaerp123}
      - DATABASE_DRIVER=org.postgresql.Driver
      - REDIS_HOST=valkey
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-mulaerp-redis-password}
      - JWT_SECRET=${JWT_SECRET:-your-super-secret-jwt-key-change-in-production-min-32-chars}
    depends_on:
      postgres:
        condition: service_healthy
      valkey:
        condition: service_healthy
    networks:
      - mulaerp-network
    restart: unless-stopped
    volumes:
      - ./logs/backend:/app/logs

  # PostgreSQL Database (RDS Compatible)
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_DB=mulaerp
      - POSTGRES_USER=mulaerp
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-mulaerp123}
      - POSTGRES_INITDB_ARGS=--encoding=UTF-8 --lc-collate=C --lc-ctype=C
    networks:
      - mulaerp-network
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mulaerp -d mulaerp"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Valkey (Redis Fork) for Caching and Performance
  valkey:
    image: valkey/valkey:7.2-alpine
    ports:
      - "6379:6379"
    command: >
      valkey-server 
      --appendonly yes 
      --requirepass ${REDIS_PASSWORD:-mulaerp-redis-password}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000
    networks:
      - mulaerp-network
    restart: unless-stopped
    volumes:
      - valkey-data:/data
    environment:
      - VALKEY_PASSWORD=${REDIS_PASSWORD:-mulaerp-redis-password}
    healthcheck:
      test: ["CMD", "valkey-cli", "--raw", "incr", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  # Nginx Reverse Proxy (disabled for development, using Vite dev server)
  # nginx:
  #   image: nginx:alpine
  #   ports:
  #     - "80:80"
  #   volumes:
  #     - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
  #     - ./logs/nginx:/var/log/nginx
  #     - ./frontend/dist:/usr/share/nginx/html
  #   depends_on:
  #     - backend
  #     - frontend
  #   networks:
  #     - mulaerp-network
  #   restart: unless-stopped

  # Database Backup Service
  db-backup:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=mulaerp
      - POSTGRES_USER=mulaerp
      - POSTGRES_PASSWORD=${DATABASE_PASSWORD:-mulaerp123}
      - PGPASSWORD=${DATABASE_PASSWORD:-mulaerp123}
    volumes:
      - ./postgres_backups:/backups
      - ./backup-scripts:/scripts
    networks:
      - mulaerp-network
    restart: unless-stopped
    command: >
      sh -c "
        while true; do
          echo 'Creating database backup...'
          pg_dump -h postgres -U mulaerp -d mulaerp > /backups/mulaerp_backup_$$(date +%Y%m%d_%H%M%S).sql
          echo 'Backup completed'
          # Keep only last 7 days of backups
          find /backups -name '*.sql' -mtime +7 -delete
          sleep 86400  # Wait 24 hours
        done
      "

  # Batch Job Runner (disabled for now, will be implemented later)
  # batch-runner:
  #   build:
  #     context: ./backend
  #     dockerfile: Dockerfile
  #   environment:
  #     - SPRING_PROFILES_ACTIVE=batch
  #     - DATABASE_URL=jdbc:postgresql://postgres:5432/mulaerp
  #     - DATABASE_USERNAME=mulaerp
  #     - DATABASE_PASSWORD=${DATABASE_PASSWORD:-mulaerp123}
  #     - REDIS_HOST=valkey
  #     - REDIS_PORT=6379
  #     - REDIS_PASSWORD=${REDIS_PASSWORD:-mulaerp-redis-password}
  #   depends_on:
  #     - postgres
  #     - valkey
  #     - backend
  #   networks:
  #     - mulaerp-network
  #   restart: unless-stopped

networks:
  mulaerp-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16

volumes:
  postgres-data:
  valkey-data:

