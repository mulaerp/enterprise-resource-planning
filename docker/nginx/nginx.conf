# =============================================================================
# Mula ERP - intended test-prod topology (one origin, three routes)
# =============================================================================
# This nginx service is commented out in compose.yaml today - local/e2e dev uses the Vite dev
# server (frontend service) directly, which already proxies /api and /ws itself. This config is
# for a deployed (test-prod) instance where that dev server isn't used: nginx becomes the single
# public origin and fans out by path -
#
#     https://<host>/         -> static build of the React app (frontend/dist)
#     https://<host>/api/...  -> backend:8080 (Spring Boot REST API), prefix PRESERVED
#     https://<host>/ws       -> backend:8080 (STOMP/SockJS WebSocket endpoint), upgraded
#
# Prerequisites to actually run this (see README "Deploying beyond localhost"):
#   1. Build the frontend for production first: `cd frontend && npm run build` (or a Docker
#      build stage that does the same) - this config serves the static output at
#      frontend/dist, it does NOT run `npm run dev`. The volume mount in compose.yaml's
#      commented-out nginx service (`./frontend/dist:/usr/share/nginx/html`) assumes that
#      directory already exists and is up to date.
#   2. Uncomment the `nginx` service in compose.yaml and remove/rework the `frontend` (Vite dev)
#      service for that environment - the two are alternative front doors, not both at once.
#
# A previous version of this file had `proxy_pass http://backend:8080/;` (trailing slash) on the
# /api/ location, which makes nginx STRIP the /api/ prefix before forwarding - every request hit
# the backend at the wrong path (e.g. /api/v1/auth/login -> /v1/auth/login) and 404'd. Fixed below
# by giving proxy_pass no path component at all, so nginx forwards the original request URI
# (including /api/...) unchanged. Same fix applies to /ws, which also had no location at all
# previously (WebSockets simply didn't work through this proxy).
# =============================================================================

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;
    error_log /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json;

    # Standard WebSocket upgrade helper: Connection becomes "upgrade" when the client actually
    # sent an Upgrade header (a real WS/SockJS handshake), and "close" otherwise - so plain HTTP
    # requests to /ws (e.g. SockJS's info polling) aren't forced into upgrade semantics.
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name localhost;

        root /usr/share/nginx/html;
        index index.html;

        # React Router client-side routing: unknown paths fall back to index.html rather than a
        # bare nginx 404, so deep links (e.g. /products/123/edit) work on a hard refresh.
        location / {
            try_files $uri $uri/ /index.html;
        }

        # REST API - prefix preserved (see file header comment for the bug this fixes).
        location /api/ {
            proxy_pass http://backend:8080;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;
        }

        # WebSocket (STOMP over SockJS, see WebSocketConfig#registerStompEndpoints) - long-lived
        # connections need the Upgrade/Connection headers and much longer timeouts than a normal
        # HTTP request, or nginx will silently kill an idle-but-open socket.
        location /ws {
            proxy_pass http://backend:8080;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_connect_timeout 10s;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
