<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" role="img" aria-label="No product photo - console">
  <rect width="400" height="300" fill="#f1f5f9"/>
  <!-- Abstract console silhouette (flat body + vent slots + two accent buttons) - drawn from
       scratch as a plain geometric shape, not a copy of any real console's design. -->
  <g transform="translate(200 150)">
    <rect x="-90" y="-40" width="180" height="80" rx="14" fill="none" stroke="#94a3b8" stroke-width="4"/>
    <line x1="-65" y1="-15" x2="-20" y2="-15" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <line x1="-65" y1="0" x2="-20" y2="0" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <line x1="-65" y1="15" x2="-20" y2="15" stroke="#94a3b8" stroke-width="4" stroke-linecap="round"/>
    <circle cx="45" cy="-8" r="10" fill="#2563eb"/>
    <circle cx="70" cy="10" r="10" fill="#93c5fd"/>
  </g>
</svg>
